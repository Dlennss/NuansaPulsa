name: Frontend

on:
  push:
    branches:
      - main
    paths:
      - "nuansapulsa-fe/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nuansapulsa-fe/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuansapulsa-fe

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
          cache: npm
          cache-dependency-path: nuansapulsa-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate deployment secrets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST || secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME || secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing GitHub secret: HOST or SERVER_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing GitHub secret: USERNAME or SERVER_USER"; exit 1; }
          if [ -z "$DEPLOY_KEY" ] && [ -z "$DEPLOY_PASSWORD" ]; then
            echo "Missing GitHub secret: SSH_PRIVATE_KEY or SERVER_PASSWORD"
            exit 1
          fi

      - name: Install password SSH helper
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Configure SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST || secrets.SERVER_HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || secrets.SERVER_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "$DEPLOY_KEY" ]; then
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull, build, and restart frontend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST || secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME || secrets.SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || secrets.SERVER_PORT }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
          FRONTEND_SERVICE: ${{ secrets.FRONTEND_SERVICE || secrets.FRONTEND_SERVICE_NAME }}
        run: |
          set -euo pipefail
          SSH_AUTH=()
          SSH_PASSWORD=()
          if [ -n "${DEPLOY_KEY:-}" ]; then
            SSH_AUTH=(-i ~/.ssh/deploy_key)
          else
            export SSHPASS="$DEPLOY_PASSWORD"
            SSH_PASSWORD=(sshpass -e)
          fi

          "${SSH_PASSWORD[@]}" ssh "${SSH_AUTH[@]}" -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "REMOTE_APP_DIR='${REMOTE_APP_DIR:-/home/syarif/app/NuansaPulsa}' FRONTEND_SERVICE='${FRONTEND_SERVICE:-nuansapulsa-fe.service}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR="$REMOTE_APP_DIR"

          cd "$APP_DIR"
          git pull --ff-only origin main

          if [ ! -f "$APP_DIR/nuansapulsa-fe/.env.local" ]; then
            echo "Missing $APP_DIR/nuansapulsa-fe/.env.local"
            echo "Create it from nuansapulsa-fe/.env-example and fill production values."
            exit 1
          fi

          cd "$APP_DIR/nuansapulsa-fe"
          npm ci
          npm run lint
          npm run build

          sudo -n systemctl restart "$FRONTEND_SERVICE"
          sudo -n systemctl status "$FRONTEND_SERVICE" --no-pager -l || true
          REMOTE_SCRIPT
